name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci
      - name: Report all frontend dependency vulnerabilities
        working-directory: front-end
        continue-on-error: true
        run: |
          npm audit --json > audit-full-report.json || true
          node -e 'const fs=require("node:fs"); let a={}; try { a=JSON.parse(fs.readFileSync("audit-full-report.json","utf8")); } catch { console.error("Could not parse full npm audit report"); process.exit(0); } const entries=Object.entries(a.vulnerabilities || {}); for (const [name,v] of entries) { const via=(v.via || []).map(x => typeof x === "string" ? x : `${x.title || "Advisory"} (${x.url || "no URL"}; range=${x.range || "unknown"})`).join(" | "); console.log(`${name}: severity=${v.severity}; range=${v.range}; direct=${v.isDirect}; via=${via}; fix=${JSON.stringify(v.fixAvailable)}`); } console.log(`Full dependency audit totals: ${JSON.stringify(a.metadata?.vulnerabilities || {})}`);'
      - name: Audit frontend production dependencies
        working-directory: front-end
        run: |
          npm audit --omit=dev --audit-level=high --json > audit-report.json || {
            node -e 'const a=require("./audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.error(`${name}: ${v.severity}; direct=${v.isDirect}; fix=${JSON.stringify(v.fixAvailable)}`); console.error(`Production dependency findings: ${a.metadata?.vulnerabilities?.total ?? 0}`)'
            exit 1
          }
          node -e 'const a=require("./audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(`${name}: ${v.severity}; direct=${v.isDirect}; fix=${JSON.stringify(v.fixAvailable)}`); console.log(`Production dependency findings: ${a.metadata?.vulnerabilities?.total ?? 0}`)'
      - name: Build frontend
        working-directory: front-end
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci
      - name: Validate Prisma schema
        working-directory: back-end
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate
      - name: Generate Prisma client
        working-directory: back-end
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Audit backend production dependencies
        working-directory: back-end
        run: |
          npm audit --omit=dev --audit-level=high --json > audit-report.json || {
            node -e 'const a=require("./audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.error(`${name}: ${v.severity}; direct=${v.isDirect}; fix=${JSON.stringify(v.fixAvailable)}`); console.error(`Production dependency findings: ${a.metadata?.vulnerabilities?.total ?? 0}`)'
            exit 1
          }
          node -e 'const a=require("./audit-report.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(`${name}: ${v.severity}; direct=${v.isDirect}; fix=${JSON.stringify(v.fixAvailable)}`); console.log(`Production dependency findings: ${a.metadata?.vulnerabilities?.total ?? 0}`)'
      - name: Run backend tests
        working-directory: back-end
        run: npm test
      - name: Check backend JavaScript syntax
        working-directory: back-end
        shell: bash
        run: |
          node --check server.js
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0)
