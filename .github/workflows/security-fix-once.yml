name: One-time dependency security update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-fix-once.yml"

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatible backend security updates
        working-directory: back-end
        run: npm audit fix --package-lock-only
      - name: Apply compatible frontend production security updates
        working-directory: front-end
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add back-end/package-lock.json front-end/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes were required."
            exit 0
          fi
          git commit -m "chore(security): update vulnerable dependency lockfiles"
          git push origin main
